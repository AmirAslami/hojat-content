<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت HOJAT</title>
<style>
@font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-ExtraBold.ttf') format('truetype');font-weight:800;font-display:swap}

:root{
  --bg:#0a0e17; --bg2:#0d1220; --surface:#141c2d; --surface2:#1b2438; --hover:#20293f;
  --text:#f2f0eb; --muted:#a8aebf; --line:#263049;
  --accent:#e8552e; --accent2:#f78c3f; --ok:#0f9d76; --warn:#f7b26f; --err:#ef4444;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--accent),var(--accent2));border-radius:99px}

body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.8;overflow:hidden;height:100vh}

/* ================= layout ================= */
.app{display:flex;height:100vh}

/* ---------- sidebar ---------- */
.sidebar{
  width:236px;flex:none;background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;z-index:30;
}
.brand{
  padding:20px 18px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:2px;
}
.brand h1{font-size:20px;font-weight:800;letter-spacing:.25em}
.brand h1 b{color:var(--accent)}
.brand small{color:var(--muted);font-size:10px;margin-right:8px}
nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:right;
  background:none;border:none;color:var(--muted);cursor:pointer;
  padding:10px 13px;border-radius:12px;font-family:inherit;font-size:13.5px;font-weight:700;
  margin-bottom:3px;transition:background .2s,color .2s,padding .2s;position:relative;
}
.nav-item .ic{font-size:16px;width:22px;text-align:center;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.nav-item:hover{background:var(--surface);color:var(--text);padding-right:16px}
.nav-item:hover .ic{transform:scale(1.15)}
.nav-item.active{
  background:linear-gradient(135deg,rgba(232,85,46,.18),rgba(247,140,63,.10));
  color:#fff;border:1px solid rgba(232,85,46,.35);padding-right:15px;
}
.nav-item.active::before{
  content:'';position:absolute;right:-10px;top:20%;height:60%;width:3px;
  background:linear-gradient(var(--accent),var(--accent2));border-radius:99px;
}
.nav-item .badge{margin-right:auto;background:var(--surface2);color:var(--muted);font-size:10.5px;border-radius:99px;padding:1px 8px}
.nav-item.active .badge{background:rgba(232,85,46,.25);color:var(--accent2)}
.side-foot{padding:14px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}
.side-foot .repo-line{display:flex;align-items:center;gap:7px}
.side-foot .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;transition:background .3s,box-shadow .3s}
.side-foot .dot.ok{background:var(--ok);box-shadow:0 0 8px rgba(15,157,118,.6)}
.side-foot .dot.err{background:var(--err)}

/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  height:62px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;
  background:rgba(13,18,32,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:20;
}
.topbar h1{font-size:16.5px;font-weight:800;animation:fadeUp .3s ease both}
.topbar .spacer{flex:1}
.conn-badge{
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 13px;
  transition:border-color .3s,color .3s;
}
.conn-badge.ok{color:var(--ok);border-color:rgba(15,157,118,.4)}
.conn-badge.err{color:#f87171;border-color:rgba(239,68,68,.4)}
.conn-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.content{flex:1;overflow-y:auto;padding:22px;position:relative}
.view{animation:fadeUp .35s ease both;max-width:1060px;margin:0 auto}

/* ---------- cards & stats ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;display:flex;align-items:center;gap:14px;
  transition:transform .25s,border-color .25s,box-shadow .25s;
  animation:fadeUp .4s ease both;
}
.stat-card:hover{transform:translateY(-3px);border-color:#34405c;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.stat-card .ic{
  width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex:none;
}
.stat-card .ic.orange{background:rgba(232,85,46,.15);color:var(--accent2)}
.stat-card .ic.violet{background:rgba(124,58,237,.15);color:#c4b5fd}
.stat-card .ic.green{background:rgba(15,157,118,.15);color:#34d399}
.stat-card .ic.blue{background:rgba(43,92,255,.15);color:#93b0ff}
.stat-card .num{font-size:24px;font-weight:800;line-height:1.2}
.stat-card .lbl{font-size:11.5px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;animation:fadeUp .35s ease both}
.card h3{font-size:14px;margin-bottom:10px}

/* ---------- buttons ---------- */
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;padding:9px 16px;font-size:13px;font-weight:700;color:#fff;transition:transform .15s,box-shadow .25s,background .25s,opacity .2s,border-color .25s}
button:active{transform:scale(.96)}
button:disabled{opacity:.5;cursor:wait}
.b-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 14px rgba(232,85,46,.3)}
.b-primary:hover{box-shadow:0 6px 20px rgba(232,85,46,.5);transform:translateY(-1px)}
.b-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.b-ghost:hover{border-color:var(--accent);color:var(--accent2)}
.b-soft{background:rgba(232,85,46,.1);color:var(--accent2);border:1px solid rgba(232,85,46,.3);font-size:12px;padding:7px 13px}
.b-soft:hover{background:rgba(232,85,46,.2)}
.b-danger{background:none;color:#f87171;border:1px solid rgba(239,68,68,.4);padding:6px 13px;font-size:12px;border-radius:11px}
.b-danger:hover{background:rgba(239,68,68,.12)}
.b-ok{background:linear-gradient(135deg,var(--ok),#16c79a);box-shadow:0 4px 16px rgba(15,157,118,.35);padding:10px 24px}
.b-ok:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(15,157,118,.55)}
.b-ok.saving{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(15,157,118,.45)}50%{box-shadow:0 0 0 12px rgba(15,157,118,0)}}

/* ---------- toolbar / rows ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.row-item{
  display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin-bottom:10px;
  transition:border-color .25s,box-shadow .25s,transform .2s;animation:fadeUp .35s ease both;
}
.row-item:hover{border-color:#3a4665;box-shadow:0 4px 16px rgba(0,0,0,.3);transform:translateY(-2px)}
.row-item .grow{flex:1;min-width:0}
.row-item .title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .actions{display:flex;gap:7px;flex:none;opacity:.85}
.thumb-s{width:58px;height:40px;border-radius:9px;object-fit:cover;border:1px solid var(--line);flex:none}
.thumb-ph{width:58px;height:40px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;border-radius:99px;padding:2px 9px;flex:none}
.badge.cat{background:rgba(43,92,255,.14);color:#93b0ff;border:1px solid rgba(43,92,255,.3)}
.badge.ok{background:rgba(15,157,118,.1);color:#34d399;border:1px solid rgba(15,157,118,.35)}
.badge.warn{background:rgba(247,178,111,.1);color:var(--warn);border:1px solid rgba(247,178,111,.35)}
.badge.type{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

.pbar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:1}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width 1s cubic-bezier(.4,0,.2,1)}

/* ---------- fields ---------- */
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.field{flex:1;min-width:180px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;transition:color .2s}
.field:focus-within label{color:var(--accent2)}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:8px 11px;
  font-family:inherit;font-size:13px;background:var(--bg2);color:var(--text);
  transition:border-color .25s,box-shadow .25s;
}
.field select{cursor:pointer}.field select option{background:var(--surface)}
.field textarea{min-height:58px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,85,46,.15)}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(5,8,16,.7);backdrop-filter:blur(5px);
  z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .25s ease both;
}
.modal{
  width:100%;max-width:680px;max-height:88vh;overflow-y:auto;
  background:var(--bg2);border:1px solid var(--line);border-radius:20px;
  animation:popIn .3s cubic-bezier(.34,1.56,.64,1) both;
}
.modal-head{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:2;border-radius:20px 20px 0 0}
.modal-head h3{font-size:15px;flex:1}
.modal-body{padding:16px 20px}
.modal-foot{display:flex;gap:10px;justify-content:flex-start;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg2);border-radius:0 0 20px 20px}
.media-strip{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:rgba(232,85,46,.05);border:1px dashed rgba(232,85,46,.35);
  border-radius:12px;padding:10px 12px;margin-bottom:10px;
}
.thumb-preview{width:74px;height:48px;border-radius:9px;object-fit:cover;border:1px solid var(--line)}
.up-note{font-size:10.5px;color:var(--muted);flex-basis:100%}

/* ---------- editor pages ---------- */
.editor-head{
  display:flex;align-items:center;gap:14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;margin-bottom:16px;
  animation:fadeUp .35s ease both;
}

/* ---------- toast / skeleton ---------- */
.toast{
  position:fixed;bottom:24px;left:50%;z-index:99;transform:translate(-50%,20px);
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  padding:11px 20px;border-radius:14px;font-size:13px;display:none;
  box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap;max-width:92vw;
  animation:toastIn .35s cubic-bezier(.34,1.56,.64,1) both;
}
.toast.ok{border-color:rgba(15,157,118,.5)} .toast.err{border-color:rgba(239,68,68,.5)}
#skeleton{position:fixed;inset:0;z-index:80;background:rgba(10,14,23,.9);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#skeleton.show{display:flex}
.spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#skeleton p{color:var(--muted);font-size:13px;animation:blink 1.6s infinite}

/* ---------- texts view groups ---------- */
.txt-group{margin-bottom:14px}
.txt-group > h3{
  font-size:13px;color:var(--accent2);padding:9px 13px;background:var(--surface2);
  border-radius:12px;margin-bottom:10px;font-weight:700;
}

.empty{
  text-align:center;padding:50px 20px;border:1.5px dashed var(--line);border-radius:var(--radius);
  animation:fadeUp .4s ease both;
}
.empty .big{font-size:40px;margin-bottom:8px;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.empty p{color:var(--muted);font-size:13px}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;align-items:center;border-left:none;border-bottom:1px solid var(--line)}
  .brand{padding:12px 14px;border-bottom:none}
  nav{display:flex;overflow-x:auto;padding:8px;flex:1}
  .nav-item{white-space:nowrap;padding:8px 12px}
  .nav-item.active::before{display:none}
  .side-foot{display:none}
  .content{padding:14px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><h1>HOJAT<b>.</b></h1><small>پنل مدیریت</small></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="repo-line"><span class="dot" id="sideDot"></span><span id="sideRepo">—</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">داشبورد</h1>
      <div class="spacer"></div>
      <div class="conn-badge" id="connBadge"><span class="dot"></span><span id="connText">وصل نشده</span></div>
      <button class="b-ok" id="saveBtn" onclick="saveToGithub()">💾 ذخیره در گیت‌هاب</button>
    </header>
    <div class="content"><div class="view" id="view"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="skeleton"><div class="spinner"></div><p id="skeletonText">در حال ارتباط با گیت‌هاب…</p></div>
<input id="mediaInput" type="file" style="display:none">
<div id="modalRoot"></div>

<script>
'use strict';
/* ============================================================
   HOJAT panel — dashboard-style admin for the portfolio app.
   All data lives in content.json on GitHub; the app fetches it.
   ============================================================ */

const ICONS = ['psychology','inventory_2','play_circle','fitness_center','mic','auto_awesome','movie','videocam','edit_note'];
const ICON_LABELS = {psychology:'ذهن/روان‌شناسی', inventory_2:'محصول', play_circle:'پخش', fitness_center:'تناسب اندام', mic:'میکروفون', auto_awesome:'موشن/جرقه', movie:'فیلم', videocam:'دوربین', edit_note:'نوشتن'};
const CATS = ['Instagram','YouTube','Ads'];
const CONTACT_TYPES = ['telegram','instagram','phone','rubika','bale','email'];
const CONTACT_LABELS = {telegram:'تلگرام', instagram:'اینستاگرام', phone:'شماره تماس', rubika:'روبیکا', bale:'بله', email:'ایمیل'};

const VIEWS = [
  {id:'dashboard', ic:'📊', t:'داشبورد'},
  {id:'works',     ic:'🎬', t:'نمونه‌کارها'},
  {id:'skills',    ic:'📈', t:'مهارت‌ها'},
  {id:'collabs',   ic:'🤝', t:'همکاری‌ها'},
  {id:'services',  ic:'🛠', t:'خدمات'},
  {id:'contacts',  ic:'📮', t:'راه‌های ارتباط'},
  {id:'texts',     ic:'📝', t:'متن‌های صفحه'},
  {id:'settings',  ic:'⚙️', t:'تنظیمات'},
];

const TEXT_FIELDS = [
  {g:'هیرو و معرفی', items:[
    {k:'name', l:'نام و نام‌خانوادگی'},
    {k:'nameEn', l:'نام لاتین'},
    {k:'kicker', l:'تخصص (خط بالای نام)'},
    {k:'heroLead', l:'جمله معرفی'},
  ]},
  {g:'دکمه‌ها و تگ‌ها', items:[
    {k:'seeWorks', l:'دکمه نمونه‌کارها'},
    {k:'aboutMe', l:'دکمه درباره من'},
    {k:'presentMode', l:'دکمه حالت ارائه'},
    {k:'stat1v', l:'تگ ۱'},
    {k:'stat1', l:'زیرنویس تگ ۱'},
    {k:'stat2v', l:'تگ ۲'},
    {k:'stat2', l:'زیرنویس تگ ۲'},
    {k:'stat3v', l:'تگ ۳ (شهر)'},
    {k:'stat3', l:'زیرنویس تگ ۳'},
  ]},
  {g:'رویکرد تدوین', items:[
    {k:'approach', l:'تیتر بخش'},
    {k:'approachSub', l:'زیرتیتر'},
    {k:'a1t', l:'اصول ۱ — عنوان'},{k:'a1', l:'اصول ۱ — توضیح'},
    {k:'a2t', l:'اصول ۲ — عنوان'},{k:'a2', l:'اصول ۲ — توضیح'},
    {k:'a3t', l:'اصول ۳ — عنوان'},{k:'a3', l:'اصول ۳ — توضیح'},
    {k:'a4t', l:'اصول ۴ — عنوان'},{k:'a4', l:'اصول ۴ — توضیح'},
  ]},
  {g:'نمونه‌کارها و درباره', items:[
    {k:'featured', l:'تیتر منتخب‌ها'},
    {k:'works', l:'تیتر صفحه نمونه‌کارها'},
    {k:'worksSub', l:'زیرتیتر نمونه‌کارها'},
    {k:'worksNote', l:'یادداشت نمونه‌کارها'},
    {k:'aboutTitle', l:'تیتر درباره'},
    {k:'aboutText', l:'متن درباره'},
  ]},
  {g:'مهارت‌ها / همکاری‌ها / خدمات', items:[
    {k:'skills', l:'تیتر مهارت‌ها'},
    {k:'exp', l:'تیتر همکاری‌ها'},
    {k:'expSub', l:'زیرتیتر همکاری‌ها'},
    {k:'services', l:'تیتر خدمات'},
    {k:'servicesSub', l:'زیرتیتر خدمات'},
  ]},
  {g:'تحصیلات و تجهیزات', items:[
    {k:'edu', l:'تیتر بخش'},
    {k:'eduT', l:'عنوان مدرک'},
    {k:'eduD', l:'توضیح مدرک'},
    {k:'gearT', l:'تیتر تجهیزات'},
    {k:'gearText', l:'متن تجهیزات'},
  ]},
  {g:'تماس و فوتر', items:[
    {k:'contactT', l:'تیتر همکاری؟'},
    {k:'contactD', l:'متن دعوت به همکاری'},
    {k:'contactRows', l:'تیتر راه‌های ارتباط'},
    {k:'sendMsg', l:'دکمه ثبت پیام'},
    {k:'phName', l:'جای‌نگه‌دار نام'},
    {k:'phMsg', l:'جای‌نگه‌دار پیام'},
    {k:'footer', l:'متن فوتر'},
  ]},
];

function blankData(){ return { texts:{fa:{}, en:{}}, works:[], skills:[], collabs:[], services:[], contacts:[] }; }
let data = blankData();
let loadedFromGithub = false;
let fileSha = null;
let owner = '', repo = '', branch = 'main', path = 'content.json';
let currentView = 'dashboard';
let pendingUpload = null;

/* ---------------- tiny helpers ---------------- */
const $ = id => document.getElementById(id);
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'oninput' || k === 'onclick') node[k] = v;
    else if (k === 'value') node.value = v ?? '';
    else node.setAttribute(k, v);
  }
  for (const c of children) {
    if (c === '' || c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}
function field(labelText, value, oninput, tag = 'input', options) {
  const wrap = el('div', {class:'field'});
  wrap.appendChild(el('label', {}, [document.createTextNode(labelText)]));
  let input;
  if (tag === 'select' && options) {
    input = document.createElement('select');
    for (const o of options()) input.appendChild(el('option', {value:o.v}, [document.createTextNode(o.t)]));
  } else input = document.createElement(tag);
  input.value = value ?? '';
  input.oninput = oninput;
  wrap.appendChild(input);
  return wrap;
}
function trField(labelText, obj, key) {

  row.appendChild(field(labelText + ' (فارسی)', obj[key]?.fa, e => { obj[key] = obj[key] || {}; obj[key].fa = e.target.value; }));
  row.appendChild(field(labelText + ' (انگلیسی)', obj[key]?.en, e => { obj[key] = obj[key] || {}; obj[key].en = e.target.value; }));
  return row;
}
function toast(msg, kind = '') {
  const t = $('toast'); t.textContent = msg; t.className = 'toast ' + kind; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3200);
}
function skeleton(show, text) { if (text) $('skeletonText').textContent = text; $('skeleton').classList.toggle('show', show); }
function stagger(container) {
  [...container.querySelectorAll('.row-item, .stat-card, .card')].forEach((n, i) => n.style.animationDelay = (i * 40) + 'ms');
}

function pagesBase(){ return `https://${(owner||'').toLowerCase()}.github.io/${repo}`; }

/* ---------------- settings & GitHub ---------------- */
function loadSettings() {
  owner = localStorage.getItem('hojat-owner') || 'AmirAslami';
  repo = localStorage.getItem('hojat-repo') || 'hojat-content';
  branch = localStorage.getItem('hojat-branch') || 'main';
  path = localStorage.getItem('hojat-path') || 'content.json';
  $('sideRepo').textContent = `${owner}/${repo}`;
  const tok = localStorage.getItem('hojat-token') || '';
  const ti = $('setTok'); if (ti) ti.value = tok;
  const ri = $('setRepo'); if (ri) ri.value = owner + '/' + repo;
  updateConn(null);
}
function saveSettingsFromInputs() {
  const ri = $('setRepo'), ti = $('setTok');
  if (!ri || !ti) return;
  const m = ri.value.trim().split('/');
  if (m.length === 2) { owner = m[0]; repo = m[1]; } else repo = ri.value.trim();
  localStorage.setItem('hojat-owner', owner);
  localStorage.setItem('hojat-repo', repo);
  localStorage.setItem('hojat-token', ti.value.trim());
  $('sideRepo').textContent = `${owner}/${repo}`;
}
function saveSettings() {
  // legacy path (topbar inputs removed) — keep repo fields synced if present
  saveSettingsFromInputs();
}
function updateConn(state) {
  const b = $('connBadge'), t = $('connText'), d = $('sideDot');
  b.className = 'conn-badge' + (state === true ? ' ok' : state === false ? ' err' : '');
  t.textContent = state === true ? `متصل • ${owner}/${repo}` : state === false ? 'خطای اتصال' : 'وصل نشده';
  d.className = 'dot' + (state === true ? ' ok' : state === false ? ' err' : '');
}
function apiHeaders() {
  const tok = (localStorage.getItem('hojat-token') || '').trim();
  if (!tok) { toast('برای ذخیره/آپلود، توکن گیت‌هاب لازم است — در «تنظیمات» وارد کن', 'err'); throw new Error('no token'); }
  return { 'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json' };
}
async function ghFetch(url, options) {
  const res = await fetch(url, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(`${res.status}: ${body.message || 'خطای گیت‌هاب'}`);
  }
  return res;
}
function b64ToUtf8(b64) {
  const bin = atob(b64.replace(/\n/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function fileToB64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function loadFromGithub(silent = false) {
  saveSettingsFromInputs();
  if (!owner || !repo) { toast('نام ریپو را در «تنظیمات» وارد کن', 'err'); return; }
  skeleton(true, 'در حال بارگذاری محتوا…');
  try {
    const res = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`, { headers: apiHeaders() });
    const json = await res.json();
    fileSha = json.sha;
    data = JSON.parse(b64ToUtf8(json.content));
    if (!data.texts || typeof data.texts !== 'object') data.texts = {fa:{}, en:{}};
    for (const k of ['works','skills','collabs','services','contacts']) if (!Array.isArray(data[k])) data[k] = [];
    loadedFromGithub = true;
    updateConn(true);
    renderCurrent();
    if (!silent) toast('محتوا از گیت‌هاب بارگذاری شد ✓', 'ok');
  } catch (e) {
    updateConn(false);
    if (!silent) toast('خطا در بارگذاری: ' + e.message, 'err');
  } finally { skeleton(false); }
}

async function commitContent(msg) {
  const text = JSON.stringify(data, null, 2) + '\n';
  for (let attempt = 1; attempt <= 3; attempt++) {
    let sha = null;
    try {
      const meta = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`, { headers: apiHeaders() });
      sha = (await meta.json()).sha;
    } catch { /* new file */ }
    try {
      await ghFetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        method: 'PUT', headers: apiHeaders(),
        body: JSON.stringify({ message: msg, content: btoa(unescape(encodeURIComponent(text))), sha, branch }),
      });
      fileSha = sha;
      return;
    } catch (e) {
      const isConflict = String(e.message).includes('409');
      if (attempt === 3 || !isConflict) throw e;
      await new Promise(r => setTimeout(r, 900));
    }
  }
}
async function saveToGithub(silent = false) {
  saveSettingsFromInputs();
  if (!owner || !repo) { toast('نام ریپو را در «تنظیمات» وارد کن', 'err'); return; }
  if (!loadedFromGithub && !silent) {
    if (!confirm('محتوای گیت‌هاب هنوز بارگذاری نشده. ذخیره ممکن است تغییرات قبلی را بازنویسی کند. ادامه می‌دهی؟')) return;
  }
  const btn = $('saveBtn');
  btn.disabled = true; btn.classList.add('saving'); btn.textContent = '⏳ در حال ذخیره…';
  if (!silent) skeleton(true, 'در حال ذخیره محتوا…');
  try {
    await commitContent('آپدیت محتوا از پنل — ' + new Date().toLocaleString('fa-IR'));
    updateConn(true);
    setStatusOk();
    if (!silent) toast('ذخیره شد! اپ حداکثر تا ۳۰ ثانیه بعد به‌روز می‌شود ✓', 'ok');
  } catch (e) {
    updateConn(false);
    toast('خطا در ذخیره: ' + e.message, 'err');
  } finally {
    skeleton(false); btn.disabled = false; btn.classList.remove('saving');
    btn.textContent = '💾 ذخیره در گیت‌هاب';
  }
}
function setStatusOk(){ /* topbar status handled by conn badge */ }

/* ---------------- media upload ---------------- */
function pickMedia(workId, kind, accept) {
  const inp = $('mediaInput');
  inp.accept = accept;
  pendingUpload = { workId, kind };
  inp.click();
}
$('mediaInput').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f && pendingUpload) uploadMedia(pendingUpload.workId, pendingUpload.kind, f);
  pendingUpload = null;
});
async function uploadMedia(workId, kind, file) {
  const w = data.works.find(x => x.id === workId); if (!w) return;
  const isVideo = kind === 'video';
  if (isVideo && file.size > 90 * 1024 * 1024) { toast('ویدیو بزرگ‌تر از حد گیت‌هاب است (~۹۰MB) — ویدیوی بلند: لینک یوتیوب/درایو', 'err'); return; }
  if (isVideo && file.size > 25 * 1024 * 1024) toast('ویدیو کمی سنگین است؛ روی اینترنت موبایل ممکن است کند باز شود', '');
  skeleton(true, isVideo ? 'در حال آپلود ویدیو…' : 'در حال آپلود عکس…');
  try {
    const ext = ((file.name.split('.').pop() || '').toLowerCase() || (isVideo ? 'mp4' : 'jpg'));
    const mediaPath = `media/${workId}/${isVideo ? 'video' : 'thumb'}.${ext}`;
    let sha = null;
    try {
      const meta = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/contents/${mediaPath}?ref=${branch}`, { headers: apiHeaders() });
      sha = (await meta.json()).sha;
    } catch { /* new file */ }
    const b64 = await fileToB64(file);
    await ghFetch(`https://api.github.com/repos/${owner}/${repo}/contents/${mediaPath}`, {
      method: 'PUT', headers: apiHeaders(),
      body: JSON.stringify({ message: `آپلود ${isVideo ? 'ویدیو' : 'کاور'} برای «${w.title?.fa || workId}»`, content: b64, sha, branch }),
    });
    const url = `${pagesBase()}/${mediaPath}`;
    if (isVideo) { w.videoUrl = url; w.url = null; } else { w.thumbUrl = url; }
    await saveToGithub(true);
    toast((isVideo ? '🎬 ویدیو' : '🖼 کاور') + ' آپلود و ذخیره شد ✓', 'ok');
    renderCurrent();
  } catch (e) {
    toast('خطا در آپلود: ' + e.message, 'err');
  } finally { skeleton(false); }
}
function clearMedia(workId, kind) {
  const w = data.works.find(x => x.id === workId); if (!w) return;
  if (kind === 'video') w.videoUrl = null; else w.thumbUrl = null;
  renderCurrent();
  toast('از محتوا حذف شد — برای اعمال، ذخیره بزن', '');
}

/* ---------------- modal ---------------- */
function openModal(title, bodyNode, { onSave, onCancel }) {
  const root = $('modalRoot');
  root.innerHTML = '';
  const overlay = el('div', {class:'modal-overlay'});
  const modal = el('div', {class:'modal'});
  const head = el('div', {class:'modal-head'}, [
    el('h3', {}, [document.createTextNode(title)]),
    el('button', {class:'b-ghost', style:'padding:5px 11px', onclick:close}, [document.createTextNode('✕')]),
  ]);
  const body = el('div', {class:'modal-body'});
  body.appendChild(bodyNode);
  const foot = el('div', {class:'modal-foot'}, [
    el('button', {class:'b-primary', onclick: async () => {
      try { await onSave(); close(); } catch (e) { toast('خطا: ' + e.message, 'err'); }
    }}, [document.createTextNode('✓ تایید و ذخیره')]),
    el('button', {class:'b-ghost', onclick:() => { onCancel && onCancel(); close(); }}, [document.createTextNode('انصراف')]),
  ]);
  modal.appendChild(head); modal.appendChild(body); modal.appendChild(foot);
  overlay.appendChild(modal);
  overlay.addEventListener('click', e => { if (e.target === overlay) { onCancel && onCancel(); close(); } });
  root.appendChild(overlay);

  function close() { root.innerHTML = ''; }
}

/* ---------------- boot ---------------- */
function boot() {
  renderNav();
  showView('dashboard');
  loadSettings();
  if (localStorage.getItem('hojat-token')) loadFromGithub(true);
}
boot();
